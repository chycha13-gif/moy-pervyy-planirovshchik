<!doctype html>
<html lang="ru" data-theme="paper-plum">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4EBDD">
  <meta name="application-name" content="Мой план расходов">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="description" content="Личный учёт доходов и расходов. Ваши записи сохраняются в этом браузере.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234E284C'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='24' fill='%23FFF9F0'%3E%E2%82%BD%3C/text%3E%3C/svg%3E">
  <title>Мой план расходов</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="pwa.js" defer></script>
</head>
<body>
  <div id="boot-message" class="boot-message">
    <strong>Мой план расходов</strong>
    <p>Открываем ваш журнал…</p>
    <p>Если приложение не запустилось, откройте его по сохранённой HTTPS-ссылке с интернетом и повторите загрузку. Для локальной версии проверьте, что рядом находятся style.css и script.js и браузер разрешает открывать локальные файлы.</p>
  </div>
  <noscript><p class="boot-message">Для работы планировщика включите JavaScript в браузере.</p></noscript>
  <div id="app"></div>
  <dialog id="editor" class="editor" aria-labelledby="editor-title"></dialog>
  <dialog id="confirmation" class="confirmation" aria-labelledby="confirmation-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
